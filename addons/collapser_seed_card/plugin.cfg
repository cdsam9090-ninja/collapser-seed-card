[plugin]

name="Collapser Seed Card"
description="Run the Collapser public demo from inside the editor. Pick one of the two published example records, run it against the live demo service, and copy its seed card: the seed that reproduces the run, the world it made, and the result fingerprint anyone can re-check. This add-on is a client of the public demo endpoint (collapser-pilot.fly.dev). It runs the two published canonical examples only; it derives nothing locally, takes no key, and sends nothing but the example choice."
author="Artist Without A Canvas Studio"
version="1.0.0"
script="plugin.gd"
